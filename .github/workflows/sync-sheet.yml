name: Sync data, build and deploy

# 1本のワークフローで「スプレッドシート取得 → 記事のHTML化 → 公開」まで行う。
# (Actionsが自動コミットしても別のワークフローは起動しない仕様のため、まとめている)
on:
  push:
    branches: [main]      # 記事やページを更新して push したとき
  schedule:
    # 毎週月曜 日本時間 6:00 に実行(UTC 日曜 21:00)。日曜の夜までにシートへ入力しておく。
    - cron: '0 21 * * 0'
  workflow_dispatch: {}   # 手動実行ボタンも使えるようにする

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch published sheets and convert to JSON
        env:
          # Googleスプレッドシートの「日次」タブと「ワークアウト」タブを、それぞれ
          # 「ウェブに公開」したCSVのURL。Settings > Secrets and variables > Actions > Variables に保存する。
          SHEET_DAILY_CSV_URL: ${{ vars.SHEET_DAILY_CSV_URL }}
          SHEET_WORKOUTS_CSV_URL: ${{ vars.SHEET_WORKOUTS_CSV_URL }}
        run: |
          if [ -z "$SHEET_DAILY_CSV_URL" ] && [ -z "$SHEET_WORKOUTS_CSV_URL" ]; then
            echo "シートのURLが未設定のため、リポジトリ内の data/log.json をそのまま使います。"
          elif [ -z "$SHEET_DAILY_CSV_URL" ] || [ -z "$SHEET_WORKOUTS_CSV_URL" ]; then
            echo "SHEET_DAILY_CSV_URL と SHEET_WORKOUTS_CSV_URL は、両方を設定してください。README.md を参照。"
            exit 1
          else
            # -f: 取得に失敗したら止める(失敗したまま古いデータや空データで公開しない)
            curl -fsSL --retry 3 "$SHEET_DAILY_CSV_URL" -o data/raw_daily.csv
            curl -fsSL --retry 3 "$SHEET_WORKOUTS_CSV_URL" -o data/raw_workouts.csv
            test -s data/raw_daily.csv
            test -s data/raw_workouts.csv
            # 列が想定と違う場合は、ここでエラーになり公開されない
            python3 scripts/csv_to_json.py --daily data/raw_daily.csv --workouts data/raw_workouts.csv --out data/log.json
          fi

      - name: Build site
        env:
          # 独自ドメインを使うときだけ、Variables に SITE_URL(例: https://example.com)を追加する。未設定なら初期値を使う。
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 scripts/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
